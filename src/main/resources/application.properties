spring.application.name=money-manager


# JDBC
#spring.datasource.url=jdbc:mysql://localhost:3306/moneymanager?createDatabaseIfNotExist=true
#spring.datasource.username=root
#spring.datasource.password=root
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



# servlet context path
server.servlet.context-path=/api/v1.0

# EMAIL config
# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${password}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# JWT keys
jwt.secret=7f4c9a2e8d6b1f3a5c7e9b2d4f6a8c1e3d5b7f9a2c4e6d8
jwt.expiration=86400000


# frontend url
money.manager.frontend.url=${FRONTEND_URL}


spring.profiles.active=prod

app.activation.url=${BACKEND_URL}